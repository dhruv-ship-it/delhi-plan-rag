[project]
name = "zonewise"
version = "0.1.0"
description = "Location-aware RAG assistant for Delhi planning law"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pymupdf>=1.28.2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
