[project]
name = "zonewise"
version = "0.1.0"
description = "Location-aware RAG assistant for Delhi planning law"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "chromadb>=1.5.9",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "geopandas>=1.2.0",
    "pymupdf>=1.28.2",
    "pyproj>=3.8.0",
    "python-dotenv",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
